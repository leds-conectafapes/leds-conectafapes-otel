receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "${ALLOWED_ORIGINS}"
          allowed_headers:
            - "*"

processors:
  batch:
    timeout: 10s

exporters:
  clickhousetraces:
    datasource: tcp://${CLICKHOUSE_HOST}:9000/signoz_traces
    use_new_schema: true
  clickhousemetricswrite:
    endpoint: tcp://${CLICKHOUSE_HOST}:9000/signoz_metrics
  clickhouselogsexporter:
    dsn: tcp://${CLICKHOUSE_HOST}:9000/signoz_logs
    use_new_schema: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousetraces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhousemetricswrite]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouselogsexporter]
