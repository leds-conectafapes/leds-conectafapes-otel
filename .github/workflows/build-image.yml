name: Build da imagem do coletor

on:
  push:
    branches:
      - develop
    paths:
      - external-otel/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v6

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: external-otel
          push: true
          tags: |
            ghcr.io/leds-conectafapes/leds-conectafapes-otel:${{ github.sha }}
            ghcr.io/leds-conectafapes/leds-conectafapes-otel:develop

      # O chart do PRODEST referencia a imagem por digest, entao e ele que vai
      # para o values-hom.yaml.
      - name: Digest
        run: echo "Digest publicado: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
